<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>TikTok Auth Callback - Shorts Auto Poster</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:60px auto;padding:0 20px;text-align:center;color:#222}
#code{font-size:14px;word-break:break-all;background:#f2f2f2;padding:16px;border-radius:8px;margin:20px 0;user-select:all;cursor:pointer}
button{padding:10px 20px;font-size:14px;cursor:pointer;border-radius:6px;border:none;background:#7C5CFC;color:white}
</style>
</head>
<body>
<h2>✅ Autorizare primită</h2>
<p>Copiază codul de mai jos (click pe el selectează tot) și lipește-l în terminal, în scriptul <code>tiktok_auth.py</code>:</p>
<div id="code">se încarcă...</div>
<button onclick="copyCode()">📋 Copiază</button>
<p style="color:#888;font-size:13px;margin-top:30px">Poți închide pagina asta după ce ai copiat codul.</p>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code") || "(nu am găsit niciun cod în URL)";
document.getElementById("code").innerText = code;

function copyCode() {
  navigator.clipboard.writeText(code);
  alert("Copiat!");
}
</script>
</body>
</html>
